name: MoodSync
options:
  bundleIdPrefix: app.moodsync
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_IDENTITY: "Apple Development"

packages:
  MoodSyncCore:
    path: Packages/MoodSyncCore

targets:
  MoodSync:
    type: application
    platform: iOS
    sources:
      - path: MoodSync
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_NAME: MoodSync
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MoodSync/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Mood Sync
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - package: MoodSyncCore
      - target: MoodSyncWidget
        embed: true

  MoodSyncWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MoodSyncWidget
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    configFiles:
      Debug: Config/Widget.xcconfig
      Release: Config/Widget.xcconfig
    settings:
      base:
        PRODUCT_NAME: MoodSyncWidget
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MoodSyncWidget/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - package: MoodSyncCore

fileGroups:
  - MoodSync/MoodSync.entitlements
  - MoodSync/MoodSyncAppGroup.entitlements
  - MoodSync/MoodSyncPaid.entitlements
  - MoodSyncWidget/MoodSyncWidget.entitlements
  - MoodSyncWidget/MoodSyncWidgetAppGroup.entitlements

schemes:
  MoodSync:
    build:
      targets:
        MoodSync: all
        MoodSyncWidget: all
    run:
      config: Debug
    archive:
      config: Release
